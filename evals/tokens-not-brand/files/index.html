<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskly – zarządzanie zadaniami</title>
<style>
:root{--brand-primary:#7c3aed;--brand-accent:#06b6d4;--brand-font:Inter,sans-serif;--radius:16px}
body{font-family:var(--brand-font);margin:0}
h1{background:linear-gradient(90deg,var(--brand-primary),var(--brand-accent));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:64px}
.btn{background:var(--brand-primary);color:#fff;border-radius:var(--radius);padding:12px 20px}
</style>
</head>
<body>
<main>
  <h1>Twoje zadania, uporządkowane na nowo</h1>
  <p>Planuj, przypisuj i kończ zadania w jednym miejscu.</p>
  <a class="btn" href="/start">Zacznij za darmo</a>
</main>
</body>
</html>
