name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the skill (skill folder at the archive root)
        run: cd skills && zip -r ../site-mechanic.zip site-mechanic
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" site-mechanic.zip --title "site-mechanic $GITHUB_REF_NAME" --generate-notes
